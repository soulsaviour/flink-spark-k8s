# Smoke test for the Spark operator: computes pi with the examples jar that
# ships in the Spark image. If this completes, submission, RBAC and executors
# all work.
#   kubectl apply -f spark/spark-pi.yaml
#   kubectl -n spark-jobs get sparkapplication spark-pi -w
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-jobs
spec:
  type: Scala
  mode: cluster
  image: spark:4.2.0-python3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.13-4.2.0.jar
  arguments:
    - "1000"
  sparkVersion: "4.2.0"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
  executor:
    instances: 2
    cores: 1
    memory: 512m
