# kubeflow/spark-operator 2.5.2
spark:
  # Namespaces SparkApplications may run in; the chart creates the driver's
  # service account and RBAC there.
  jobNamespaces:
    - spark-jobs
  serviceAccount:
    # IRSA: drivers and executors assume this role for S3 access.
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/spark-jobs-s3

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

webhook:
  enable: true
